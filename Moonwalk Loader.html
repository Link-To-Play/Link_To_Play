<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonwalk Loader</title>
<style>
:root {
  --loader-size: 160px;      /* change this to scale the loader */
  --loader-color: #e50914;
  --loader-far: #8f0610;     /* darker colour for the far arm and leg */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; background: #080808; }
.loader { width: var(--loader-size); aspect-ratio: 160 / 150; pointer-events: none; filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
svg { width: 100%; height: 100%; overflow: visible; display: block; }
.line { fill: none; stroke: var(--loader-color); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.far { stroke: var(--loader-far); }
.ground { stroke: url(#fade); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 14 14; }
.shadow { fill: #000; opacity: .35; }
</style>
</head>

        <stop offset="0.5" stop-color="#555"/>
        <stop offset="1" stop-color="#555" stop-opacity="0"/>

    </defs>
